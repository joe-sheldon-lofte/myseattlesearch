# File: .github/workflows/update_daily.yml

name: Daily Data Harvest Pipeline

on:
  schedule:
    # Runs every day at 06:00 UTC (11:00 PM Pacific)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests pandas google-api-python-client boto3 pillow pillow-heif

      - name: Extract Cloud Agent Credentials File
        env:
          GA_CREDENTIALS: ${{ secrets.GA_GOOGLE_CREDENTIALS }}
        run: |
          if [ -n "$GA_CREDENTIALS" ]; then
            echo "$GA_CREDENTIALS" > credentials.json
          fi

      - name: Run Daily Harvester Script
        env:
          GA_GOOGLE_CREDENTIALS: ${{ secrets.GA_GOOGLE_CREDENTIALS }}
          CITY_DATA_SHEET_ID: ${{ secrets.CITY_DATA_SHEET_ID }}
          WEBSITE_DATA_SHEET_ID: ${{ secrets.WEBSITE_DATA_SHEET_ID }}
          QUIZZES_SHEET_ID: ${{ secrets.QUIZZES_SHEET_ID }}
          WSDOT_ACCESS_CODE: ${{ secrets.WSDOT_ACCESS_CODE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/harvest_daily.py

      - name: Clean Temporary Execution Keys
        if: always()
        run: rm -f credentials.json

      - name: Commit and Push Updated Daily Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No daily data changes detected. Skipping commit."
          else
            git commit -m "chore(data): automated daily harvest update [skip ci]"
            git push
          fi