name: Daily Data Harvest Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests pandas google-api-python-client boto3 pillow pillow-heif sentry-sdk feedparser python-dateutil

      - name: Extract Cloud Agent Credentials File
        env:
          GA_CREDENTIALS: ${{ secrets.GA_GOOGLE_CREDENTIALS }}
        run: |
          if [ -n "$GA_CREDENTIALS" ]; then
            echo "$GA_CREDENTIALS" > credentials.json
          fi

      - name: Pull Existing R2 Datasets
        env:
          CF_MASTER_ACCOUNT_ID: ${{ secrets.CF_MASTER_ACCOUNT_ID }}
          CF_MASTER_ACCESS_KEY_ID: ${{ secrets.CF_MASTER_ACCESS_KEY_ID }}
          CF_MASTER_SECRET_ACCESS_KEY: ${{ secrets.CF_MASTER_SECRET_ACCESS_KEY }}
          CF_MASTER_S3_API_ENDPOINT: ${{ secrets.CF_MASTER_S3_API_ENDPOINT }}
          R2_DATA_BUCKET_NAME: ${{ secrets.R2_DATA_BUCKET_NAME }}
        run: python scripts/helpers/pull_r2_data.py

      - name: Run Daily Harvester Script
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GA_GOOGLE_CREDENTIALS: ${{ secrets.GA_GOOGLE_CREDENTIALS }}
          WEBSITE_DATA_CORE_SHEET_ID: ${{ secrets.WEBSITE_DATA_CORE_SHEET_ID }}
          OPERATIONS_SHEET_ID: ${{ secrets.OPERATIONS_SHEET_ID }}
          WSDOT_ACCESS_CODE: ${{ secrets.WSDOT_ACCESS_CODE }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          CF_MASTER_API_TOKEN: ${{ secrets.CF_MASTER_API_TOKEN }}
          CF_MASTER_ACCOUNT_ID: ${{ secrets.CF_MASTER_ACCOUNT_ID }}
          CF_MASTER_ACCESS_KEY_ID: ${{ secrets.CF_MASTER_ACCESS_KEY_ID }}
          CF_MASTER_SECRET_ACCESS_KEY: ${{ secrets.CF_MASTER_SECRET_ACCESS_KEY }}
          CF_MASTER_S3_API_ENDPOINT: ${{ secrets.CF_MASTER_S3_API_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_DATA_BUCKET_NAME: ${{ secrets.R2_DATA_BUCKET_NAME }}
          CF_DATABASE_CUSTOMERS_ID: ${{ secrets.CF_DATABASE_CUSTOMERS_ID }}
          CF_DATABASE_CMS_ID: ${{ secrets.CF_DATABASE_CMS_ID }}
        run: python scripts/harvest_daily.py

      - name: Push Updated Datasets to R2
        env:
          CF_MASTER_ACCOUNT_ID: ${{ secrets.CF_MASTER_ACCOUNT_ID }}
          CF_MASTER_ACCESS_KEY_ID: ${{ secrets.CF_MASTER_ACCESS_KEY_ID }}
          CF_MASTER_SECRET_ACCESS_KEY: ${{ secrets.CF_MASTER_SECRET_ACCESS_KEY }}
          CF_MASTER_S3_API_ENDPOINT: ${{ secrets.CF_MASTER_S3_API_ENDPOINT }}
          R2_DATA_BUCKET_NAME: ${{ secrets.R2_DATA_BUCKET_NAME }}
        run: python scripts/helpers/push_r2_data.py

      - name: Clean Temporary Execution Keys
        if: always()
        run: rm -f credentials.json