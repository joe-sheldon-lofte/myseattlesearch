# File: .github/workflows/update_daily.yml

name: Daily Data Harvest Pipeline

on:
  schedule:
    # Runs every day at 06:00 UTC (11:00 PM Pacific)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install gspread google-auth requests pandas; fi

      - name: Run Daily Harvester Script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          CITY_DATA_SHEET_ID: ${{ secrets.CITY_DATA_SHEET_ID }}
          WEBSITE_DATA_SHEET_ID: ${{ secrets.WEBSITE_DATA_SHEET_ID }}
        run: python scripts/harvest_daily.py

      - name: Commit and Push Updated Daily Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No daily data changes detected. Skipping commit."
          else
            git commit -m "chore(data): automated daily harvest update [skip ci]"
            git push
          fi