name: Deploy Eleventy Hub to Cloudflare Workers

on:
  push:
    branches: ["redesign-v4"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-workers-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node Engine
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Project Dependencies
        run: npm install

      - name: Sync R2 Data, Build Eleventy & Index Pagefind
        run: npm run build
        env:
          R2_ALL_ACCESS_TOKEN: ${{ secrets.R2_ALL_ACCESS_TOKEN }}
          R2_ALL_SECRET_ACCESS_KEY: ${{ secrets.R2_ALL_SECRET_ACCESS_KEY }}
          R2_DATA_BUCKET_NAME: ${{ secrets.R2_DATA_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}

      - name: Deploy Static Assets to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
