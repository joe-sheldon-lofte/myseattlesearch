name: Rapid Telemetry Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  harvest-rapid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests sentry-sdk boto3

      - name: Execute Rapid Harvester
        id: harvest
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_DATA_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_DATABASE_TELEMETRY_ID: ${{ secrets.CF_DATABASE_TELEMETRY_ID }}
        run: |
          set +e
          python scripts/harvest_rapid.py
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Trigger Instant GitHub Pages Build on Alert Change
        if: steps.harvest.outputs.exit_code == '22'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Emergency alert state changed. Triggering Deploy Eleventy Hub..."
          gh workflow run "deploy-site.yml" --ref main

      - name: Fail Workflow on Harvester Error
        if: steps.harvest.outputs.exit_code != '0' && steps.harvest.outputs.exit_code != '22'
        run: exit 1