name: Rapid Telemetry Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  harvest-rapid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests sentry-sdk boto3 google-auth google-api-python-client

      - name: Extract Cloud Agent Credentials File
        env:
          GA_CREDENTIALS: ${{ secrets.GA_GOOGLE_CREDENTIALS }}
        run: echo "$GA_CREDENTIALS" > credentials.json

      - name: Pull Existing R2 Datasets
        env:
          CF_MASTER_ACCOUNT_ID: ${{ secrets.CF_MASTER_ACCOUNT_ID }}
          CF_MASTER_ACCESS_KEY_ID: ${{ secrets.CF_MASTER_ACCESS_KEY_ID }}
          CF_MASTER_SECRET_ACCESS_KEY: ${{ secrets.CF_MASTER_SECRET_ACCESS_KEY }}
          CF_MASTER_S3_API_ENDPOINT: ${{ secrets.CF_MASTER_S3_API_ENDPOINT }}
          R2_ALL_ACCESS_TOKEN: ${{ secrets.R2_ALL_ACCESS_TOKEN }}
          R2_ALL_SECRET_ACCESS_KEY: ${{ secrets.R2_ALL_SECRET_ACCESS_KEY }}
          R2_DATA_BUCKET_NAME: ${{ secrets.R2_DATA_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: python scripts/helpers/pull_r2_data.py

      - name: Execute Rapid Sheet Sync (Market Dashboard)
        env:
          WEBSITE_DATA_CORE_SHEET_ID: ${{ secrets.WEBSITE_DATA_CORE_SHEET_ID }}
        run: python scripts/rapid/rapid_sheet_sync.py

      - name: Execute Rapid Harvester (Emergency Alerts & Telemetry)
        id: harvest
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CF_MASTER_API_TOKEN: ${{ secrets.CF_MASTER_API_TOKEN }}
          CF_MASTER_ACCOUNT_ID: ${{ secrets.CF_MASTER_ACCOUNT_ID }}
          CF_MASTER_ACCESS_KEY_ID: ${{ secrets.CF_MASTER_ACCESS_KEY_ID }}
          CF_MASTER_SECRET_ACCESS_KEY: ${{ secrets.CF_MASTER_SECRET_ACCESS_KEY }}
          CF_MASTER_S3_API_ENDPOINT: ${{ secrets.CF_MASTER_S3_API_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_DATA_BUCKET_NAME: ${{ secrets.R2_DATA_BUCKET_NAME }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_DATABASE_TELEMETRY_ID: ${{ secrets.CF_DATABASE_TELEMETRY_ID }}
        run: |
          set +e
          python scripts/harvest_rapid.py
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Push Updated Datasets to R2
        id: push_r2
        env:
          CF_MASTER_ACCOUNT_ID: ${{ secrets.CF_MASTER_ACCOUNT_ID }}
          CF_MASTER_ACCESS_KEY_ID: ${{ secrets.CF_MASTER_ACCESS_KEY_ID }}
          CF_MASTER_SECRET_ACCESS_KEY: ${{ secrets.CF_MASTER_SECRET_ACCESS_KEY }}
          CF_MASTER_S3_API_ENDPOINT: ${{ secrets.CF_MASTER_S3_API_ENDPOINT }}
          R2_ALL_ACCESS_TOKEN: ${{ secrets.R2_ALL_ACCESS_TOKEN }}
          R2_ALL_SECRET_ACCESS_KEY: ${{ secrets.R2_ALL_SECRET_ACCESS_KEY }}
          R2_DATA_BUCKET_NAME: ${{ secrets.R2_DATA_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: python scripts/helpers/push_r2_data.py

      - name: Clean Temporary Execution Keys
        if: always()
        run: rm -f credentials.json

      - name: Trigger Instant Site Build (Alert Changes or R2 Data Updates)
        if: steps.harvest.outputs.exit_code == '22' || steps.push_r2.outputs.r2_uploaded_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering Deploy Eleventy Hub due to alert state change or R2 data refresh..."
          gh workflow run "deploy-site.yml" --ref ${{ github.ref_name }}

      - name: Fail Workflow on Harvester Error
        if: steps.harvest.outputs.exit_code != '0' && steps.harvest.outputs.exit_code != '22'
        run: exit 1
