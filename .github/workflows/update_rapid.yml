name: Rapid Telemetry Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  harvest-rapid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests sentry-sdk boto3 google-auth google-api-python-client

      - name: Extract Cloud Agent Credentials File
        env:
          GA_CREDENTIALS: ${{ secrets.GA_GOOGLE_CREDENTIALS }}
        run: echo "$GA_CREDENTIALS" > credentials.json

      - name: Execute Rapid Sheet Sync (Market Dashboard)
        env:
          WEBSITE_DATA_CORE_SHEET_ID: ${{ secrets.WEBSITE_DATA_CORE_SHEET_ID }}
        run: python scripts/rapid/rapid_sheet_sync.py

      - name: Commit Updated Market Dashboard Telemetry
        id: commit_market
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hourly_market.json || true
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated rapid sync: Market Dashboard telemetry"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
            echo "market_changed=true" >> $GITHUB_OUTPUT
          else
            echo "market_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Execute Rapid Harvester (Emergency Alerts & Telemetry)
        id: harvest
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_DATA_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_DATABASE_TELEMETRY_ID: ${{ secrets.CF_DATABASE_TELEMETRY_ID }}
        run: |
          set +e
          python scripts/harvest_rapid.py
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Clean Temporary Execution Keys
        run: rm -f credentials.json

      - name: Trigger Instant Pages Build (Market Updates or Alert Changes)
        if: steps.harvest.outputs.exit_code == '22' || steps.commit_market.outputs.market_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering Deploy Eleventy Hub due to alert state change or market data refresh..."
          gh workflow run "deploy-site.yml" --ref main

      - name: Fail Workflow on Harvester Error
        if: steps.harvest.outputs.exit_code != '0' && steps.harvest.outputs.exit_code != '22'
        run: exit 1
