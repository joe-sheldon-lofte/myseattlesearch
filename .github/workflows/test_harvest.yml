name: Test Harvest Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-harvest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl google-api-python-client google-auth requests

      - name: Authenticate Google Service Account
        env:
          GA_CREDENTIALS: ${{ secrets.GA_GOOGLE_CREDENTIALS }}
        run: |
          if [ -n "$GA_CREDENTIALS" ]; then
            echo "$GA_CREDENTIALS" > credentials.json
            echo "Service account credentials written from GA_GOOGLE_CREDENTIALS."
          fi

      - name: Run Targeted Test Script
        env:
          GA_GOOGLE_CREDENTIALS: ${{ secrets.GA_GOOGLE_CREDENTIALS }}
          CITY_DATA_SHEET_ID: ${{ secrets.CITY_DATA_SHEET_ID }}
        run: |
          python scripts/test_harvest.py

      - name: Clean Credentials
        if: always()
        run: |
          rm -f credentials.json

      - name: Commit & Push Test Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No test data changes detected. Skipping commit."
          else
            git commit -m "test: update housing stats test artifacts [skip ci]"
            git push
          fi