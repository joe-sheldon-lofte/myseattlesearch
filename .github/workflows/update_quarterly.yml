# File: .github/workflows/update_quarterly.yml

name: Quarterly Master Data Build

on:
  schedule:
    # Runs at 00:00 UTC on the 1st day of January, April, July, and October
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Script Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests urllib3 python-dateutil beautifulsoup4 sentry-sdk google-auth google-api-python-client

      - name: Extract Cloud Agent Credentials File
        env:
          GA_CREDENTIALS: ${{ secrets.GA_GOOGLE_CREDENTIALS }}
        run: |
          if [ -n "$GA_CREDENTIALS" ]; then
            echo "$GA_CREDENTIALS" > credentials.json
          fi

      - name: Execute Quarterly Data Pipeline
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          WEBSITE_DATA_CORE_SHEET_ID: ${{ secrets.WEBSITE_DATA_CORE_SHEET_ID }}
        run: python scripts/harvest_quarterly.py

      - name: Clean Temporary Execution Keys
        if: always()
        run: rm -f credentials.json

      - name: Commit and Push Updated Datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ _data/
          if git diff --staged --quiet; then
            echo "No quarterly data changes detected. Skipping commit."
          else
            git commit -m "chore(data): automated quarterly school assessment & spatial boundaries sync [skip ci]"
            git pull origin ${{ github.ref_name }} --rebase
            git push origin ${{ github.ref_name }}
          fi