# File: .github/workflows/update_weekly.yml

name: Weekly Data Harvest Pipeline

on:
  schedule:
    # Runs every Sunday at 08:00 UTC (1:00 AM Pacific)
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest-weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests pandas beautifulsoup4 socrata openpyxl lxml

      - name: Execute Master Weekly Harvester
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          CITY_DATA_SHEET_ID: ${{ secrets.CITY_DATA_SHEET_ID }}
          WEBSITE_DATA_SHEET_ID: ${{ secrets.WEBSITE_DATA_SHEET_ID }}
          WALK_SCORE_API_KEY: ${{ secrets.WALK_SCORE_API_KEY }}
          GREATSCHOOLS_API_KEY: ${{ secrets.GREATSCHOOLS_API_KEY }}
        run: python scripts/harvest_weekly.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No weekly data changes detected. Skipping commit."
          else
            git commit -m "chore(data): automated weekly harvest pipeline update [skip ci]"
            git push
          fi