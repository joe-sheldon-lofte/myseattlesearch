name: Monthly Data Harvest Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest-monthly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests urllib3 pandas google-api-python-client sentry-sdk beautifulsoup4 h3

      - name: Extract Cloud Agent Credentials File
        env:
          GA_CREDENTIALS: ${{ secrets.GA_GOOGLE_CREDENTIALS }}
        run: |
          if [ -n "$GA_CREDENTIALS" ]; then
            echo "$GA_CREDENTIALS" > credentials.json
          fi

      - name: Execute Master Monthly Harvester
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          GA_GOOGLE_CREDENTIALS: ${{ secrets.GA_GOOGLE_CREDENTIALS }}
          WEBSITE_DATA_CORE_SHEET_ID: ${{ secrets.WEBSITE_DATA_CORE_SHEET_ID }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_DATABASE_PARCELDATA_ID: ${{ secrets.CF_DATABASE_PARCELDATA_ID }}
        run: python scripts/harvest_monthly.py

      - name: Clean Temporary Execution Keys
        if: always()
        run: rm -f credentials.json

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ _data/
          if git diff --staged --quiet; then
            echo "No monthly data changes detected. Skipping commit."
          else
            git commit -m "chore(data): automated monthly municipal, parcel delta, and condo sync [skip ci]"
            git pull origin ${{ github.ref_name }} --rebase
            git push origin ${{ github.ref_name }}
          fi