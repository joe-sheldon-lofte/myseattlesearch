# File: .github/workflows/update_monthly.yml

name: Monthly Data Harvest Pipeline

on:
  schedule:
    # Runs at 09:00 UTC on the 1st day of every month
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest-monthly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests pandas

      - name: Execute Master Monthly Harvester
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          CITY_DATA_SHEET_ID: ${{ secrets.CITY_DATA_SHEET_ID }}
          WEBSITE_DATA_SHEET_ID: ${{ secrets.WEBSITE_DATA_SHEET_ID }}
        run: python scripts/harvest_monthly.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No monthly data changes detected. Skipping commit."
          else
            git commit -m "chore(data): automated monthly harvest pipeline update [skip ci]"
            git push
          fi