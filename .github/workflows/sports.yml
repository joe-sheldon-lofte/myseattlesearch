name: Manual Sports Data Fetch

on:
  workflow_dispatch: # Enables manual triggering only

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests curl_cffi

      - name: Fetch Sports Data
        run: python scripts/harvest_sports_data.py

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/sports_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Manual update sports data JSON" && git push)
